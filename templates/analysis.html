<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Department Analysis</title>

    <!-- TailwindCSS for minimalist styling -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

    <style>
        /* Custom styles for a more professional and minimalistic feel */
        body {
            background-color: #f5f7fa; /* Light gray background */
            font-family: 'Inter', sans-serif; /* Professional font choice */
            color: #334155; /* Dark muted text color */
            margin: 0;
            padding: 0;
        }

        h2 {
            font-size: 2rem;
            font-weight: 700;
            color: #1e3a8a; /* Muted blue for the header */
            text-align: center;
            margin-top: 2rem;
        }

        h3 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #4b5563; /* Darker muted gray for subheadings */
            text-align: center;
            margin-bottom: 1rem;
        }

        .chart-container {
            max-width: 600px;
            margin: 2rem auto; /* Centering the chart */
            padding: 1rem;
            background-color: #ffffff; /* White card for contrast */
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); /* Soft shadow for the card */
        }

        .chart-container img {
            max-width: 100%;
            height: auto;
            border-radius: 0.5rem; /* Rounded corners for the image */
        }

        .back-to-dashboard {
            display: block;
            text-align: center;
            margin: 2rem 0;
            color: #1e3a8a; /* Muted blue for link */
            font-weight: 500;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            background-color: #e5e7eb; /* Light gray button style */
            border-radius: 0.375rem;
            transition: background-color 0.2s ease-in-out;
        }

        .back-to-dashboard:hover {
            background-color: #d1d5db; /* Slightly darker gray on hover */
        }

        /* Media query for responsiveness */
        @media (max-width: 640px) {
            .chart-container {
                margin: 1rem;
                padding: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Page Title -->
    <h2>Department Analysis</h2>

    <!-- Chart Section -->
    <div class="chart-container">
        <h3>Performance Overview</h3>
        <img src="data:image/png;base64,{{ chart_data }}" alt="Department Performance Chart"/>
    </div>

    <!-- Back to Dashboard Button -->
    <a href="{{ url_for('admin.admin_dashboard') }}" class="back-to-dashboard">Back to Dashboard</a>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OOPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold text-center mb-6">Forgot Password</h1>
        <form action="/forgot_password" method="post" class="space-y-4">
            <div>
                <label for="email" class="block text-gray-700 font-medium mb-2">Enter your email:</label>
                <input type="email" id="email" name="email" required
                    class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <input type="submit" value="Send Password Reset Link"
                    class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600 transition-colors">
            </div>
        </form>
    </div>
</body>

</html>

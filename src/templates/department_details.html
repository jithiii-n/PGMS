<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Department Details</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-gray-100">
    <div class="container mx-auto p-6 bg-gray-800 rounded-lg shadow-lg mt-6">
        <h2 class="text-2xl font-extrabold text-center mb-6">{{ department.name }}</h2>
        <div class="overflow-x-auto">
            <table class="min-w-full bg-gray-800">
                <tbody>
                    <tr>
                        <td class="py-4 px-6 text-lg font-medium text-gray-100">District</td>
                        <td class="py-4 px-6 text-lg text-gray-100">{{ department.district }}</td>
                    </tr>
                    <tr class="bg-gray-700">
                        <td class="py-4 px-6 text-lg font-medium text-gray-100">Officer in Charge</td>
                        <td class="py-4 px-6 text-lg text-gray-100">{{ department.officer_name }}</td>
                    </tr>
                    <tr>
                        <td class="py-4 px-6 text-lg font-medium text-gray-100">Position</td>
                        <td class="py-4 px-6 text-lg text-gray-100">{{ department.position }}</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="mt-6 text-center space-x-4">
            {% for complaint in complaints %}
            <a href="{{ url_for('admin.analysis', dept_id=complaint.deptid) }}" class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600">Analyze</a>
            {% endfor %}
            <a href="{{ url_for('admin.admin_dashboard') }}" class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600">Back to Dashboard</a>
            <!-- Add Remove/Replace Officer Button -->
           <a href="{{ url_for('admin.replace_officer_form', dept_id=department.id) }}" class="bg-red-500 text-white py-2 px-4 rounded hover:bg-red-600">Remove/Replace Officer</a>

        </div>
    </div>
</body>
</html>
